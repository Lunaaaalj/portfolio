<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Loss-Surface Engraving — sketch</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1440px;height:900px;overflow:hidden;background:#F4F6F8;color:#1B2430;font-family:"Iowan Old Style",Palatino,Georgia,serif}
  canvas{position:absolute;inset:0}
  .t{position:absolute;left:128px;top:140px;width:620px}
  h1{font-size:92px;line-height:100px;font-weight:400}
  .sub{font-size:24px;line-height:34px;font-style:italic;margin-top:28px}
  .basin{position:absolute;left:880px;top:610px;font-size:22px;line-height:30px;width:360px}
  .basin small{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:#5B6675;margin-top:4px}
  nav{position:absolute;left:128px;top:56px;display:flex;gap:40px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px}
</style></head><body>
<canvas id="c" width="1440" height="900"></canvas>
<nav><span>Selected work</span><span>Methods</span><span>Further work</span><span>Contact</span></nav>
<div class="t"><h1>Angel Eduardo Luna</h1><p class="sub">Applied mathematics and data science, Tecnológico de Monterrey</p></div>
<div class="basin">GeoStats<small>Where traffic risk concentrates in Monterrey</small></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const f=(X,Y)=>{const a=((X-1050)/260)**2+((Y-560)/180)**2,b=((X-300)/420)**2+((Y-820)/200)**2,d=((X-1300)/200)**2+((Y-150)/160)**2;return -Math.exp(-a)*1.2-Math.exp(-b)*.8-Math.exp(-d)*.6+0.00002*((X-720)**2+(Y-450)**2)*.02};
const W=1440,H=900,st=6,g=[];for(let j=0;j<=H/st;j++){g[j]=[];for(let i=0;i<=W/st;i++)g[j][i]=f(i*st,j*st)}
x.lineWidth=.7;for(let L=-1.2;L<0.2;L+=0.045){x.strokeStyle='rgba(27,36,48,.22)';x.beginPath();
 for(let j=0;j<H/st;j++)for(let i=0;i<W/st;i++){const v=[g[j][i],g[j][i+1],g[j+1][i+1],g[j+1][i]],p=[[0,0],[1,0],[1,1],[0,1]],pts=[];
  for(let e=0;e<4;e++){const a=v[e],b=v[(e+1)%4];if((a<L)!=(b<L)){const t=(L-a)/(b-a),A=p[e],B=p[(e+1)%4];pts.push([(i+A[0]+(B[0]-A[0])*t)*st,(j+A[1]+(B[1]-A[1])*t)*st])}}
  if(pts.length>=2){x.moveTo(...pts[0]);x.lineTo(...pts[1])}}x.stroke()}
let P=[620,330];x.strokeStyle='#8C2F39';x.lineWidth=2;x.beginPath();x.moveTo(...P);
for(let k=0;k<400;k++){const e=1,gx=(f(P[0]+e,P[1])-f(P[0]-e,P[1]))/2,gy=(f(P[0],P[1]+e)-f(P[0],P[1]-e))/2;const n=Math.hypot(gx,gy)||1;P=[P[0]-gx/n*3.2,P[1]-gy/n*3.2];x.lineTo(...P)}x.stroke();
x.fillStyle='#8C2F39';x.beginPath();x.arc(P[0],P[1],5,0,7);x.fill();
</script>
</body></html>
